    <header class="header">
        <div class="logo">🛍️ <span id="v-logo">Boutique</span></div>
        <div class="header-droite">
            <button class="theme-btn" type="button" onclick="ouvrirParametres()" aria-label="Paramètres" title="Paramètres"><svg class="ic" aria-hidden="true"><use href="#ic-settings"></use></svg></button>
            <a href="index.html" class="lien-retour">← Boutiques</a>
        </div>
    </header>

    <main class="accueil">

        <section class="hero">
            <img id="v-photo" class="photo-hero" alt="" hidden>
            <span class="badge">🏪 Bienvenue</span>
            <h1 id="v-nom">Chargement…</h1>
            <p id="v-note" class="vitrine-note" hidden></p>
            <p id="v-description"></p>
            <div class="contact-boutique">
                <button id="v-suivre" class="bouton-principal bouton-suivre" type="button" hidden>Suivre</button>
                <a id="v-tel" class="bouton-principal" hidden>📞 Appeler la boutique</a>
                <a id="v-whatsapp" class="bouton-principal bouton-whatsapp" hidden>💬 Écrire sur WhatsApp</a>
                <button id="v-discuter" class="bouton-principal bouton-discuter" type="button">💬 Discuter avec la boutique</button>
                <button id="v-statuts" class="bouton-principal bouton-statuts" type="button" hidden>📣 Nouveaux arrivages</button>
            </div>
        </section>

        <section class="fonctionnalites">
            <h2>Nos produits</h2>
            <div id="v-produits" class="grille-produits"></div>
        </section>

        <section class="fonctionnalites">
            <h2>Avis clients</h2>
            <div id="v-avis-resume" class="avis-resume"></div>
            <div id="v-avis-liste"></div>
            <p id="v-avis-aide" class="sous-titre" hidden>
                Les avis sont réservés aux clients qui ont reçu une commande de cette boutique.
            </p>
            <button id="v-donner-avis" class="bouton-secondaire" type="button" hidden>Donner mon avis</button>
        </section>

        <p class="pied-vitrine">Propulsé par Dukani</p>

    </main>

    <!-- FICHE PRODUIT -->
    <div id="produit" class="fenetre page-plein">
        <div class="page-contenu">
            <div class="page-entete">
                <button class="page-bouton" type="button" onclick="fermerProduit()" aria-label="Retour"><svg class="ic" aria-hidden="true"><use href="#ic-arrow-back"></use></svg></button>
                <h2 id="pp-titre">Produit</h2>
            </div>
            <div id="pp-corps" class="menu-corps"></div>
            <div class="barre-saisie barre-achat">
                <button id="pp-enregistrer" class="barre-icone" type="button" aria-label="Enregistrer"></button>
                <button id="pp-discuter" class="barre-icone" type="button" aria-label="Discuter avec la boutique"><svg class="ic" aria-hidden="true"><use href="#ic-chat-ligne"></use></svg></button>
                <button id="pp-commander" class="creer" type="button">Commander</button>
            </div>
        </div>
    </div>

    <!-- AVIS -->
    <div id="avis-modal" class="fenetre">
        <div class="creation-box">
            <button class="fermer" onclick="fermerFenetre('avis-modal')">✕</button>
            <h2>Votre avis</h2>
            <p class="sous-titre">Votre nom sera affiché avec votre avis.</p>

            <label>Note</label>
            <div id="avis-etoiles" class="avis-etoiles"></div>

            <label>Commentaire (facultatif)</label>
            <textarea id="avis-commentaire" maxlength="500" placeholder="Qualité, livraison, service…"></textarea>

            <button class="creer" type="button" onclick="envoyerAvis()">Publier mon avis</button>
            <button id="avis-supprimer" class="bouton-danger" type="button" onclick="supprimerAvis()" hidden>Supprimer mon avis</button>
        </div>
    </div>

    <div id="commande" class="fenetre">
        <div class="creation-box">
            <button class="fermer" onclick="fermerCommande()">✕</button>
            <h2>🛒 Commander</h2>
            <p class="sous-titre" id="c-produit"></p>

            <label>Quantité</label>
            <input id="c-quantite" type="number" min="1" value="1">

            <label>Votre nom</label>
            <input id="c-client" type="text" placeholder="Ex : Marie" maxlength="80">

            <label>Votre téléphone</label>
            <input id="c-telephone" type="tel" placeholder="Ex : 08XXXXXXXX" maxlength="30">

            <div id="c-paiement-bloc" hidden>
                <label>Mode de paiement</label>
                <select id="c-paiement"></select>
            </div>

            <button class="creer" id="c-bouton" onclick="envoyerCommande()">Envoyer la commande</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="statuts.js"></script>
    <script src="vitrine.js"></script>
</body>
</html>
